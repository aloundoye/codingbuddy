name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality (fmt + clippy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify workspace Rust version
        run: |
          expected=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)
          test "$(rustc --version | cut -d ' ' -f 2)" = "$expected"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile VS Code client
        working-directory: extensions/vscode
        run: |
          npm install --ignore-scripts --no-package-lock
          npm run compile

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  hygiene:
    name: hygiene (deny + docs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: AGENTS.md crate list matches Cargo.toml
        run: bash scripts/check_agents_md.sh

      - name: No blocking HTTP on the turn path
        run: bash scripts/check_async_boundaries.sh

      - name: cargo deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  unattended:
    name: unattended (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config
      - name: Install Rust toolchain
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Verify unattended execution contracts
        shell: bash
        run: |
          python -B scripts/test_unattended_conformance_gate.py
          python -B scripts/unattended_conformance.py --output "${{ runner.temp }}/unattended.json" --revision '${{ github.sha }}'
          target=$(rustc -vV | sed -n 's/^host: //p')
          python -B scripts/unattended_conformance_gate.py "${{ runner.temp }}/unattended.json" --target "$target" --revision '${{ github.sha }}'
      - name: Upload unattended evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unattended-${{ runner.os }}
          path: ${{ runner.temp }}/unattended.json
          if-no-files-found: error

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: -C debuginfo=0

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Focused trust-boundary regressions
        run: |
          cargo test --locked -p codingbuddy-cli --test cli_json p0_
          cargo test --locked -p codingbuddy-agent --test tool_use_default p0_
          cargo test --locked -p codingbuddy-mcp --lib p0_

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provider conformance
        shell: bash
        env:
          CODINGBUDDY_CERTIFICATION_REPORT: ${{ runner.temp }}/provider-certification.json
          CODINGBUDDY_BUILD_REVISION: ${{ github.sha }}
        run: |
          cargo test --locked -p codingbuddy-store -p codingbuddy-jsonrpc -p codingbuddy-diff
          cargo test --locked -p codingbuddy-cli --test cli_json delivery_one
          cargo test --locked -p codingbuddy-llm --all-targets
          cargo test --locked -p codingbuddy-testkit --test provider_certification
          cargo test --locked -p codingbuddy-testkit --test provider_eval provider_neutral_fixture_scores
          cargo test --locked -p codingbuddy-cli --test cli_json delivery_two
          cargo test --locked -p codingbuddy-cli --test cli_json delivery_four
          python scripts/test_provider_certification_gate.py

      - name: Upload provider evidence
        uses: actions/upload-artifact@v4
        with:
          name: provider-certification-${{ runner.os }}
          path: ${{ runner.temp }}/provider-certification.json
          if-no-files-found: error

      - name: "tests (workspace split: core)"
        run: cargo test --workspace --all-targets --exclude codingbuddy-agent --exclude codingbuddy-cli --exclude codingbuddy-ui

      - name: "tests (workspace split: agent)"
        run: cargo test -p codingbuddy-agent --all-targets

      - name: "tests (workspace split: cli)"
        run: cargo test -p codingbuddy-cli --all-targets

      - name: "tests (workspace split: ui)"
        run: cargo test -p codingbuddy-ui --all-targets

      - name: build
        run: cargo build --workspace

      - name: conformance scripts
        if: runner.os == 'Linux'
        run: |
          bash scripts/parity_regression_check.sh
          bash scripts/runtime_conformance_scan.sh

      - name: cli smoke
        run: cargo run --bin codingbuddy -- --json status

      - name: installer dry-run (unix)
        if: runner.os != 'Windows'
        run: bash scripts/install.sh --dry-run --version v0.0.0 --repo example/example

      - name: installer dry-run (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -DryRun -Version v0.0.0 -Repo example/example

  smoke-macos:
    name: smoke (macos)
    runs-on: macos-latest
    needs: quality
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --workspace

      - name: Focused trust-boundary regressions
        run: |
          cargo test --locked -p codingbuddy-cli --test cli_json p0_
          cargo test --locked -p codingbuddy-agent --test tool_use_default p0_
          cargo test --locked -p codingbuddy-mcp --lib p0_

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provider conformance
        shell: bash
        env:
          CODINGBUDDY_CERTIFICATION_REPORT: ${{ runner.temp }}/provider-certification.json
          CODINGBUDDY_BUILD_REVISION: ${{ github.sha }}
        run: |
          cargo test --locked -p codingbuddy-store -p codingbuddy-jsonrpc -p codingbuddy-diff
          cargo test --locked -p codingbuddy-cli --test cli_json delivery_one
          cargo test --locked -p codingbuddy-llm --all-targets
          cargo test --locked -p codingbuddy-testkit --test provider_certification
          cargo test --locked -p codingbuddy-testkit --test provider_eval provider_neutral_fixture_scores
          cargo test --locked -p codingbuddy-cli --test cli_json delivery_two
          cargo test --locked -p codingbuddy-cli --test cli_json delivery_four
          python scripts/test_provider_certification_gate.py

      - name: Upload provider evidence
        uses: actions/upload-artifact@v4
        with:
          name: provider-certification-${{ runner.os }}
          path: ${{ runner.temp }}/provider-certification.json
          if-no-files-found: error

      - name: Filesystem regressions
        run: cargo test --locked -p codingbuddy-tools --lib workspace_

      - name: cli smoke
        run: cargo run --bin codingbuddy -- --json status
