name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: extract
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.extract.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.extract.outputs.version }} already exists, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: check-version
    if: github.event_name == 'workflow_dispatch' || needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --bin codingbuddy --target ${{ matrix.target }}

      - name: Package artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/codingbuddy dist/codingbuddy
          tar -C dist -czf dist/codingbuddy-${{ matrix.target }}.tar.gz codingbuddy
          rm dist/codingbuddy

      - name: Package artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/codingbuddy.exe dist/codingbuddy.exe
          Compress-Archive -Path dist/codingbuddy.exe -DestinationPath dist/codingbuddy-${{ matrix.target }}.zip -Force
          Remove-Item dist/codingbuddy.exe

      - name: Smoke-test packaged binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "dist/codingbuddy-${{ matrix.target }}.tar.gz" -C "$smoke_dir"
          export PATH="$smoke_dir:$PATH"
          test "$(command -v codingbuddy)" = "$smoke_dir/codingbuddy"
          codingbuddy --version

      - name: Smoke-test packaged binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "codingbuddy-smoke"
          Expand-Archive -LiteralPath "dist/codingbuddy-${{ matrix.target }}.zip" -DestinationPath $smokeDir -Force
          $env:Path = "$smokeDir;$env:Path"
          if ((Get-Command codingbuddy -CommandType Application).Source -ne (Join-Path $smokeDir "codingbuddy.exe")) {
            throw "The packaged binary could not be found on PATH"
          }
          codingbuddy --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codingbuddy-${{ matrix.target }}
          path: dist/codingbuddy-${{ matrix.target }}.${{ matrix.archive_ext }}

  publish:
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: github.ref == 'refs/heads/main' && needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          find dist -mindepth 2 -type f -name 'codingbuddy-*' -exec cp {} dist/ \;

      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(codingbuddy-*.tar.gz codingbuddy-*.zip)
          if [ ${#files[@]} -ne 6 ]; then
            echo "expected six release archives, found ${#files[@]}" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/codingbuddy-*.tar.gz
            dist/codingbuddy-*.zip
            dist/checksums.txt
